    <style>

th:.24rem; height:.24rem; opacity:0; transform:translateX(-50%) scale(.1); animation:none; }.smoke { position:absolute; top:-1.1rem; left:50%; width:.72rem; height:.72rem; border-radius:50%; background:rgba(218,225,244,.54); filter:blur(1px); animation:smoke-rise 1.8s ease-out forwards; }.smoke.one{margin-left:-.85rem;animation-delay:.1s}.smoke.two{margin-left:.18rem;animation-delay:.25s}.cake-prompt { margin:.45rem 0 1.25rem; color:#f7dca1; }

       %@@@@@@@.   :@@@@:   .@@@@@@@%        
      :@@@@@@@%     ....     %@@@@@@@:       
      -@@@@@@@%  .-======-.  %@@@@@@@-       
      :@@@@@@@%  =@@@%%@@@=  %@@@@@@@:       
       %@@@@@@@.  .=****=.  .@@@@@@@%        
       =@@@@@@@=     ..     =@@@@@@=         
        +@@@@@@@+.        .+@@@@@@+          
         =@@@@@@@%*=-::-=*%@@@@@@=           
          -%@@@@@@@@%%%%@@@@@@@@%-            
           .=%@@@@@@@@@@@@@@@@%=.             
             .-*%@@@@@@@@@@%*-.               
                 .:-=+++=-:.                  
      `;

      const sceneNames = ["Dramatic intro", "Big reveal", "Heartfelt wishes", "Birthday cake", "Make a wish", "Blow the candle", "Grand finale"];
      const state = { scene: 0, wish: "", wishStatus: "idle", candleOut: false, music: false };
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const timers = new Set();
      let animationFrame = 0;
      let sound = null;
      let stopBottleFirework = null;

      const lockScreen = document.querySelector("#lock-screen");
      const giftScreen = document.querySelector("#gift-screen");
      const unlockForm = document.querySelector("#unlock-form");
      const dateInput = document.querySelector("#birthday-input");
      const dateError = document.querySelector("#date-error");
      const sceneRoot = document.querySelector("#scene-root");
      const sceneCount = document.querySelector("#scene-count");
      const sceneName = document.querySelector("#scene-name");
      const progressBar = document.querySelector("#progress-bar");
      const musicButton = document.querySelector("#music-button");

      document.querySelector("#portrait").textContent = portraitAscii;
      document.querySelector("#ascii-name").textContent = birthdayData.recipientName;

      function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, char => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "'":"&#039;", '"':"&quot;" })[char]); }
      function birthdayDigits() { const [year, month, day] = birthdayData.birthday.split("-"); return day + month + year; }
      function normalizeDate(value) {
        if (!/^[\d\s/-]*$/.test(value)) return null;
        const digits = value.replace(/\D/g, "");
        if (digits.length !== 8) return null;
        const day = Number(digits.slice(0, 2)); const month = Number(digits.slice(2, 4)); const year = Number(digits.slice(4, 8));
        const candidate = new Date(year, month - 1, day);
        return candidate.getFullYear() === year && candidate.getMonth() === month - 1 && candidate.getDate() === day ? digits : null;
      }
      function cakeMarkup(compact) {
        const smoke = state.candleOut ? '<i class="smoke one"></i><i class="smoke two"></i>' : "";
        return `<div class="cake${compact ? " compact" : ""}" aria-hidden="true"><div class="candle"><span class="flame${state.candleOut ? " out" : ""}"></span><span class="wick"></span>${smoke}</div><div class="tier top"></div><div class="tier middle"></div><div class="tier bottom"></div><div class="plate"></div></div>`;
      }
      function clearSceneTimers() { timers.forEach(id => clearTimeout(id)); timers.clear(); }
      function later(callback, milliseconds) { const id = setTimeout(() => { timers.delete(id); callback(); }, milliseconds); timers.add(id); }
      function goTo(scene) { clearSceneTimers(); state.scene = Math.max(0, Math.min(scene, 6)); renderScene(); }
      function firstName() { return birthdayData.recipientName.trim().split(/\s+/).at(-1); }
      function setMusic(enabled) {
        if (enabled && !sound) {
          try {
            const context = new AudioContext(); const gain = context.createGain(); gain.gain.value = .0001; gain.connect(context.destination);
            const oscillators = [130.81, 196, 261.63].map((frequency, index) => { const oscillator = context.createOscillator(); oscillator.type = index === 1 ? "triangle" : "sine"; oscillator.frequency.value = frequency; oscillator.connect(gain); oscillator.start(); return oscillator; });
            gain.gain.exponentialRampToValueAtTime(.018, context.currentTime + .75); context.resume().catch(() => undefined); sound = { context, gain, oscillators };
          } catch (_) { enabled = false; }
        }
        if (!enabled && sound) {
          const active = sound; active.gain.gain.setTargetAtTime(.0001, active.context.currentTime, .08);
          window.setTimeout(() => { active.oscillators.forEach(oscillator => oscillator.stop()); active.context.close().catch(() => undefined); }, 180); sound = null;
        }
        state.music = enabled; musicButton.setAttribute("aria-pressed", String(enabled)); musicButton.firstElementChild.textContent = enabled ? "♫" : "♩";
      }
      function renderScene() {
        if (stopBottleFirework) { stopBottleFirework(); stopBottleFirework = null; }
        sceneCount.textContent = `scene ${String(state.scene + 1).padStart(2, "0")} / 07`;
        sceneName.textContent = sceneNames[state.scene];
        progressBar.style.width = `${((state.scene + 1) / 7) * 100}%`;
        let html = "";
        if (state.scene === 0) {
          html = `<section class="scene intro cinematic-intro"><p class="muted">Một điều bất ngờ đang tiến lại gần...</p><div class="initials cinematic-initials" aria-label="${birthdayData.initials.join(" ")}">${birthdayData.initials.map((item, index) => `<b aria-hidden="true" style="animation-delay:${index * 1.35}s">${escapeHtml(item)}</b>`).join("")}</div><button class="text-button" data-next="1">Bỏ qua hiệu ứng</button></section>`;
          later(() => goTo(1), reducedMotion ? 2200 : birthdayData.initials.length * 1350 + 1750);
        } else if (state.scene === 1) {
          html = `<section class="scene reveal"><p class="reveal-kicker">from the stars, with love</p><h1 class="birthday-title" id="scene-title">Happy<br>Birthday</h1><p class="recipient">${escapeHtml(birthdayData.recipientName)}</p><button class="primary" data-next="2">Đọc lời chúc <span aria-hidden="true">→</span></button></section>`;
          later(() => goTo(2), reducedMotion ? 3200 : 6500);
        } else if (state.scene === 2) {
          html = `<section class="scene message"><div class="card"><p class="card-label">dear ${escapeHtml(firstName())},</p><p class="card-body">${escapeHtml(birthdayData.message)}</p><span class="signoff">with a little stardust ✦</span></div><button class="primary" data-next="3">Có bánh đang chờ <span aria-hidden="true">→</span></button></section>`;
        } else if (state.scene === 3) {
          html = `<section class="scene cake-scene"><p class="muted">Không gian đã chuẩn bị một chiếc bánh nhỏ cho ngày đặc biệt này.</p>${cakeMarkup(false)}<p class="cake-prompt">Chỉ cần một điều ước thôi.</p><button class="primary" data-next="4">Ước một điều <span aria-hidden="true">→</span></button></section>`;
        } else if (state.scene === 4) {
          const status = state.wishStatus === "success" ? "Điều ước đã được gửi vào vũ trụ ✨" : state.wishStatus === "error" ? "Hãy viết một điều ước trước đã nhé." : "";
          html = `<section class="scene wish">${cakeMarkup(true)}<div><p class="eyebrow">make a wish</p><h2 id="scene-title">Viết điều bạn muốn gửi vào vũ trụ.</h2><p class="muted">Bản prototype chỉ mô phỏng gửi điều ước. Phase 4 mới gửi qua Telegram an toàn.</p><form id="wish-form"><label class="sr-only" for="wish-input">Điều ước</label><textarea id="wish-input" maxlength="500" placeholder="Ước một điều thật đẹp...">${escapeHtml(state.wish)}</textarea><div class="wish-actions"><span class="counter" id="wish-count">${state.wish.length}/500</span><button class="primary" type="submit" ${state.wishStatus === "submitting" ? "disabled" : ""}>${state.wishStatus === "submitting" ? "Đang gửi..." : "Gửi điều ước"}</button></div></form><p class="status ${state.wishStatus === "success" ? "ok" : state.wishStatus === "error" ? "error" : ""}" role="status">${status}</p><button class="text-button" data-next="5">${state.wishStatus === "success" ? "Tới ngọn nến" : "Tiếp tục mà không gửi"}</button></div></section>`;
        } else if (state.scene === 5) {
          html = `<section class="scene blow"><p class="eyebrow">one last little thing</p><h2 id="scene-title">Chạm vào ngọn nến để thổi nào.</h2><div class="candle-stage">${cakeMarkup(false)}${state.candleOut ? '<div class="wind" aria-hidden="true">≈ ≋ ≈</div>' : '<button class="candle-trigger" type="button" data-blow><span class="sr-only">Thổi tắt ngọn nến</span></button>'}</div><p class="blow-status" role="status">${state.candleOut ? "Điều ước đã lên đường..." : "Chạm, nhấn Enter hoặc Space vào ngọn nến."}</p></section>`;
          if (state.candleOut) later(() => goTo(6), reducedMotion ? 900 : 7000);
        } else {
          html = `<section class="scene final"><p class="eyebrow">for this next orbit around the sun</p><h1 id="scene-title">Wishing you<br><em>all the best!</em> ✦</h1><p class="muted">Cứ sáng lên theo cách của riêng bạn, ${escapeHtml(firstName())} nhé.</p><div class="final-actions"><button class="primary" data-replay>Xem lại <span aria-hidden="true">↺</span></button><button class="secondary" data-next="2">Mở lại lời chúc</button></div></section>`;
        }
        sceneRoot.innerHTML = html;
        if (state.scene === 2) {
          const greeting = sceneRoot.querySelector(".card-label");
          if (greeting) greeting.textContent = `Dear ${firstName()},`;
          sceneRoot.querySelector(".signoff")?.remove();
        }
        if (state.scene === 4) {
          const wishScene = sceneRoot.querySelector(".wish");
          const wishForm = sceneRoot.querySelector("#wish-form");
          const letterStage = wishForm?.parentElement;
          if (wishScene && letterStage && wishForm) {
            wishScene.classList.add("wish-letter-scene");
            letterStage.classList.add("wish-letter-stage");
            wishForm.classList.add("wish-letter");
            letterStage.querySelector(".muted")?.remove();
            letterStage.querySelector(".text-button")?.remove();
            const bottle = document.createElement("div");
            bottle.className = "wish-bottle";
            bottle.setAttribute("aria-hidden", "true");
            bottle.innerHTML = '<i class="bottle-cap"></i><i class="bottle-twine"></i><i class="bottle-string"></i><i class="bottle-star"></i><i class="bottle-roll"></i><i class="bottle-sand"></i><i class="bottle-glint"></i>';
            wishScene.append(bottle);
            const wishButton = wishForm.querySelector('button[type="submit"]');
            if (wishButton) {
              wishButton.textContent = state.wishStatus === "rolling" ? "Sealing..." : "Wish";
              wishButton.disabled = state.wishStatus === "rolling";
            }
            if (state.wishStatus === "rolling") {
              wishScene.classList.add("wish-is-rolling");
              const paperRoll = document.createElement("div");
              paperRoll.className = "paper-roll-animation";
              paperRoll.setAttribute("aria-hidden", "true");
              wishScene.append(paperRoll);
              wishForm.querySelector("textarea").disabled = true;
              const status = letterStage.querySelector(".status");
              if (status) status.textContent = "Sealing your wish inside the bottle...";
            }
          }
        }
        if (state.scene === 5 && state.candleOut) {
          const candleStage = sceneRoot.querySelector(".candle-stage");
          if (candleStage) {
            const rocket = document.createElement("div");
            rocket.className = "rocket-bottle";
            rocket.setAttribute("aria-hidden", "true");
            rocket.innerHTML = '<i class="rocket-twine"></i><i class="rocket-string"></i><i class="rocket-star"></i><i class="rocket-note"></i><i class="rocket-motor"></i><i class="rocket-flame"></i>';
            candleStage.append(rocket);
          }
          const overlay = document.createElement("canvas");
          overlay.className = "firework-overlay scene-six-firework";
          overlay.setAttribute("aria-hidden", "true");
          sceneRoot.append(overlay);
          stopBottleFirework = drawBottleFirework(overlay);
          const blowStatus = sceneRoot.querySelector(".blow-status");
          if (blowStatus) blowStatus.textContent = "\u0110i\u1ec1u \u01b0\u1edbc \u0111\u00e3 g\u1eedi t\u1edbi B\u1ee5t \u2728";
        }
        sceneRoot.querySelectorAll("[data-next]").forEach(button => button.addEventListener("click", () => goTo(Number(button.dataset.next))));
        const replay = sceneRoot.querySelector("[data-replay]"); if (replay) replay.addEventListener("click", () => { state.wish = ""; state.wishStatus = "idle"; state.candleOut = false; goTo(0); });
        const blow = sceneRoot.querySelector("[data-blow]"); if (blow) blow.addEventListener("click", () => { state.candleOut = true; renderScene(); });
        const wishForm = sceneRoot.querySelector("#wish-form");
        if (wishForm) {
          const wishInput = sceneRoot.querySelector("#wish-input"); const wishCount = sceneRoot.querySelector("#wish-count");
          wishInput.addEventListener("input", () => { state.wish = wishInput.value; state.wishStatus = "idle"; wishCount.textContent = `${state.wish.length}/500`; });
          wishForm.addEventListener("submit", event => { event.preventDefault(); if (!state.wish.trim()) { state.wishStatus = "error"; renderScene(); return; } state.wishStatus = "rolling"; renderScene(); later(() => goTo(5), reducedMotion ? 1 : 2300); });
        }
        drawCelebration();
      }
      unlockForm.addEventListener("submit", event => {
        event.preventDefault(); const value = normalizeDate(dateInput.value);
        if (value !== birthdayDigits()) { dateError.textContent = "Chưa đúng rồi — thử lại một lần nữa nhé."; dateInput.classList.remove("shake"); void dateInput.offsetWidth; dateInput.classList.add("shake"); return; }
        dateError.textContent = ""; lockScreen.hidden = true; giftScreen.hidden = false; setMusic(true); renderScene();
      });
      musicButton.addEventListener("click", () => setMusic(!state.music));

      function drawBottleFirework(canvas) {
        const ctx = canvas.getContext("2d"); if (!ctx) return () => undefined;
        let width = 1, height = 1, ratio = 1, frame = 0, disposed = false;
        const colors = ["#fff3a7", "#9ff7ff", "#ffb0d6", "#d6bbff", "#ffd18e"];
        const sparks = Array.from({ length: reducedMotion ? 150 : 430 }, (_, index) => {
          const depth = Math.random() * 2 - 1; const angle = Math.random() * Math.PI * 2; const radius = Math.sqrt(1 - depth * depth);
          return { x:Math.cos(angle) * radius, y:Math.sin(angle) * radius, z:depth, speed:Math.random() * .58 + .42, size:Math.random() * 2.4 + .8, color:colors[index % colors.length] };
        });
        const resize = () => { const rect = canvas.getBoundingClientRect(); ratio = Math.min(window.devicePixelRatio || 1, 2); width = rect.width; height = rect.height; canvas.width = Math.max(1, Math.floor(width * ratio)); canvas.height = Math.max(1, Math.floor(height * ratio)); ctx.setTransform(ratio, 0, 0, ratio, 0, 0); };
        const startedAt = performance.now(); const ignitionDelay = reducedMotion ? 0 : 3850;
        const draw = time => {
          const elapsed = time - startedAt - ignitionDelay; ctx.clearRect(0, 0, width, height);
          if (elapsed >= 0) {
            const expansion = Math.min(1, elapsed / 1850); const fade = Math.max(0, 1 - elapsed / 3200); const centerX = width * .5; const centerY = height * .4; const span = Math.max(width, height) * (.12 + expansion * .82);
            const flash = Math.max(0, 1 - elapsed / 430); const glow = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width, height) * (.12 + expansion * .48)); glow.addColorStop(0, `rgba(255,250,218,${flash})`); glow.addColorStop(.18, `rgba(255,194,130,${flash * .55})`); glow.addColorStop(1, "rgba(255,168,223,0)"); ctx.fillStyle = glow; ctx.fillRect(0, 0, width, height);
            ctx.globalCompositeOperation = "lighter";
            sparks.slice().sort((a, b) => a.z - b.z).forEach(spark => {
              const projection = 1 / (1 + Math.max(-.58, spark.z * expansion * .78)); const distance = span * spark.speed * projection; const gravity = expansion * expansion * height * (.16 + (1 - spark.z) * .055); const x = centerX + spark.x * distance; const y = centerY + spark.y * distance + gravity; const trailX = centerX + spark.x * distance * .58; const trailY = centerY + spark.y * distance * .58 + gravity * .35;
              ctx.globalAlpha = fade * (.42 + projection * .58); ctx.strokeStyle = spark.color; ctx.fillStyle = spark.color; ctx.lineWidth = Math.max(1, spark.size * projection * (1 - expansion * .28)); ctx.beginPath(); ctx.moveTo(trailX, trailY); ctx.lineTo(x, y); ctx.stroke(); ctx.beginPath(); ctx.arc(x, y, spark.size * projection * (1 - expansion * .42), 0, Math.PI * 2); ctx.fill();
            });
            ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
          }
          if (!disposed && elapsed < 3450) frame = requestAnimationFrame(draw);
        };
        resize(); draw(performance.now()); window.addEventListener("resize", resize);
        return () => { disposed = true; cancelAnimationFrame(frame); window.removeEventListener("resize", resize); ctx.clearRect(0, 0, width, height); };
      }
      function drawOnCanvas(canvas, mode) {
        const ctx = canvas.getContext("2d"); if (!ctx) return;
        let width = 0, height = 0, ratio = 1, frame = 0;
        const stars = Array.from({ length:72 }, () => ({ x:Math.random(), y:Math.random(), size:Math.random()*1.8+.3, speed:Math.random()*.00022+.00005, opacity:Math.random()*.65+.2 }));
        const dust = Array.from({ length:96 }, () => ({ x:Math.random(), y:Math.random(), offset:Math.random()*Math.PI*2, radius:Math.random()*2+.6 }));
        const confetti = Array.from({ length:68 }, () => ({ x:Math.random(), y:Math.random()*-0.5, drift:Math.random()-.5, size:Math.random()*5+3, color:["#f2be8e","#c6b4e6","#a8d4d0","#e9a7be"][Math.floor(Math.random()*4)] }));
        function resize() { const rect = canvas.getBoundingClientRect(); ratio = Math.min(window.devicePixelRatio || 1, 2); width = rect.width; height = rect.height; canvas.width = Math.max(1, Math.floor(width*ratio)); canvas.height = Math.max(1, Math.floor(height*ratio)); ctx.setTransform(ratio,0,0,ratio,0,0); }
        function draw(time) {
          ctx.clearRect(0,0,width,height);
          stars.forEach(star => { ctx.beginPath(); ctx.fillStyle = `rgba(165,137,177,${star.opacity*.55})`; ctx.arc(star.x*width, ((star.y + time*star.speed)%1)*height, star.size, 0, Math.PI*2); ctx.fill(); });
          if (mode === 1) dust.forEach(item => { const distance=.08+((Math.sin(time/1200+item.offset)+1)/2)*.62; ctx.beginPath(); ctx.fillStyle="rgba(233,167,190,.68)"; ctx.arc(width/2+(item.x-.5)*width*distance,height/2+(item.y-.5)*height*distance,item.radius,0,Math.PI*2);ctx.fill(); });
          if (mode === 6) { [0,1,2,3].forEach(burst => { const cycle=((time/1900+burst*.23)%1+1)%1; const colors=["#f2be8e","#c6b4e6","#a8d4d0","#e9a7be"]; for(let spark=0;spark<24;spark+=1){const angle=Math.PI*2*spark/24+burst;ctx.beginPath();ctx.globalAlpha=1-cycle;ctx.fillStyle=colors[(spark+burst)%4];ctx.arc(width*(.2+burst*.21)+Math.cos(angle)*(18+cycle*Math.min(width,height)*.19),height*(.22+((burst+1)%2)*.18)+Math.sin(angle)*(18+cycle*Math.min(width,height)*.19)+cycle*cycle*60,2.2-cycle*1.1,0,Math.PI*2);ctx.fill();} }); ctx.globalAlpha=1; }
          if (mode === 6) { confetti.forEach(piece => { const y=((piece.y+time*.00015)%1.4)*height; const x=piece.x*width+Math.sin(time/440+piece.drift*12)*20; ctx.save(); ctx.translate(x,y); ctx.rotate(time/520+piece.drift*7); ctx.fillStyle=piece.color; ctx.globalAlpha=.8; ctx.fillRect(-piece.size/2,-piece.size/2,piece.size,piece.size*.55); ctx.restore(); }); ctx.globalAlpha=1; }
          if (!reducedMotion) frame=requestAnimationFrame(draw);
        }
        resize(); draw(performance.now()); window.addEventListener("resize", resize); return () => { cancelAnimationFrame(frame); window.removeEventListener("resize", resize); };
      }
      let stopCelebration = null;
      function drawCelebration() { if (stopCelebration) stopCelebration(); stopCelebration = drawOnCanvas(document.querySelector("#celebration"), state.scene); }
      drawOnCanvas(document.querySelector("#stars"), 0);
    </script>
  </body>
